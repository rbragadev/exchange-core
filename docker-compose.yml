version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exchange_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - exchange-core

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: exchange-core-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@exchange-core.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8888:80"
    depends_on:
      - postgres
    networks:
      - exchange-core

volumes:
  postgres_data:

networks:
  exchange-core:
    driver: bridge
